[project]
name = "qcaas"
version = "0.1.0"
description = "Quantum-Computing-as-a-Service MVP: Qiskit circuit optimization, cost quoting and business interpretation API with IBM + Classiq backends."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "qiskit-qasm3-import>=0.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
classiq = [
    "classiq>=0.70",
]

[project.scripts]
qcaas = "qcaas.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qcaas"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", ".ignore"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"qcaas/core/interpret/report.py" = ["E501"]  # business prose strings
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
 