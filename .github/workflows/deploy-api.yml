name: Deploy API

# Staging deploys automatically after a successful image build on main.
# Production requires manual approval via the GitHub "production" environment.
on:
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Image tag to deploy (default latest)
        default: latest

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qcaas-api

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' || github.event.workflow_run.conclusion == 'success'
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://qcaas-api-staging.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --config infra/fly.toml --app qcaas-api-staging --image "$IMAGE:${{ inputs.image_tag || 'latest' }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
      - name: Deploy accounts service
        run: flyctl deploy --config infra/fly.accounts.toml --app qcaas-accounts-staging --image "ghcr.io/${{ github.repository_owner }}/qcaas-accounts:${{ inputs.image_tag || 'latest' }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
      - name: Smoke test
        run: |
          bash infra/smoke.sh https://qcaas-api-staging.fly.dev
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://qcaas-accounts-staging.fly.dev/healthz | grep -q '"qcaas_api":"ok"'
        env:
          QCAAS_SMOKE_API_KEY: ${{ secrets.STAGING_SMOKE_API_KEY }}

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production          # configure "required reviewers" on this environment in GitHub
      url: https://qcaas-api.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --config infra/fly.toml --app qcaas-api --image "$IMAGE:${{ inputs.image_tag }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
      - name: Deploy accounts service
        run: flyctl deploy --config infra/fly.accounts.toml --app qcaas-accounts --image "ghcr.io/${{ github.repository_owner }}/qcaas-accounts:${{ inputs.image_tag }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
      - name: Smoke test
        run: |
          bash infra/smoke.sh https://qcaas-api.fly.dev
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://qcaas-accounts.fly.dev/healthz | grep -q '"qcaas_api":"ok"'
        env:
          QCAAS_SMOKE_API_KEY: ${{ secrets.PRODUCTION_SMOKE_API_KEY }}
