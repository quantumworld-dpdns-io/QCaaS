---
# Copy to vars/secrets.yml, fill in, then encrypt:  ansible-vault encrypt vars/secrets.yml
# Neon: create two databases (or two branches) in one free project, one per service.
qcaas_database_url: "postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/qcaas_api?sslmode=require"
accounts_db_url: "postgres://user:pass@ep-xxx.us-east-2.aws.neon.tech/qcaas_accounts?sslmode=require"

qcaas_admin_token: "CHANGE-ME-openssl-rand-hex-32"
qcaas_api_key_salt: "CHANGE-ME-openssl-rand-hex-32"
accounts_jwt_secret: "CHANGE-ME-openssl-rand-hex-32"
accounts_encryption_key: "CHANGE-ME-openssl-rand-base64-32"   # exactly 32 bytes, base64
accounts_admin_emails: "you@example.com"

# Optional real-hardware credentials (leave empty to stay in offline/fake-backend mode)
qcaas_offline_mode: "true"
qcaas_ibm_token: ""
qcaas_ibm_instance: ""
classiq_client_id: ""
classiq_client_secret: ""
