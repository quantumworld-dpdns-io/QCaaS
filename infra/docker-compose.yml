# Local / single-host deployment.
#   cp .env.example .env            (edit secrets)
#   docker compose -f infra/docker-compose.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: qcaas-api:local
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      QCAAS_DATABASE_URL: sqlite:////data/qcaas.db
      QCAAS_ENVIRONMENT: ${QCAAS_ENVIRONMENT:-dev}
    volumes:
      - qcaas-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Phase 8: job queue for long-running QPU submissions. Enable together with a worker service.
  # redis:
  #   image: redis:7-alpine
  #   command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
  #   volumes:
  #     - qcaas-redis:/data

volumes:
  qcaas-data:
  # qcaas-redis:
